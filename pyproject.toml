[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textql"
description = "Official Python SDK for the TextQL Platform API"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "TextQL", email = "support@textql.com" }]
keywords = ["textql", "sdk", "api", "analytics", "ana"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version"]
dependencies = [
    "httpx >=0.27,<1",
    "typing_extensions >=4.7; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest >=8",
    "pytest-asyncio >=0.23",
    "ruff >=0.6",
    "pyright >=1.1.380",
    "respx >=0.21",
]

[project.urls]
Homepage = "https://textql.com"
Documentation = "https://docs.textql.com"
Repository = "https://github.com/TextQLLabs/textql-python"
Issues = "https://github.com/TextQLLabs/textql-python/issues"
Changelog = "https://github.com/TextQLLabs/textql-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/textql/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/textql"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportMissingParameterType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
